html{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}

.gap{background:color-mix(in srgb,var(--acc) 16%,var(--surf))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;margin:0;gap:0;justify-content:center;background:color-mix(in srgb,var(--surf) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}

</style></head><body>
<div id="splash"><b>§</b><p>Karten</p></div>
<div id="upd" class="banner" hidden><span>Neue Version verfügbar.</span><button onclick="location.reload()">Neu laden</button></div>
<nav id="nav"></nav><main id="app"></main>
<script src="config.js"></script>
<script>
/* Die Firebase-Zugangsdaten stehen in der Datei config.js (einmal anlegen, bleibt bei Updates unberührt). */
const CFG=window.CFG||{};
const APP_V='2.7';

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Der Lerntag wechselt um 4 Uhr nachts (wie bei Anki), damit späte Lerneinheiten zum „heutigen“ Tag zählen */
const ROLL=4;
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4-ROLL*36e5)/864e5);
const dayStr=d=>new Date(d*864e5).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',timeZone:'UTC'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch{return null}};
const DEV=ls('dev')||(()=>{const v=uid();ls('dev',v);return v})();
const TYPES={basic:'Frage / Antwort',cloze:'Lückentext',steps:'Stufenweise aufdecken',outline:'Schema mit Gliederung',dispute:'Meinungsstreit'};const APP_V2=1;
const KINDS=['decks','cards','logs','settings'];
const G='https://www.gstatic.com/firebasejs/10.14.1/';

let S={decks:[],cards:[],logs:[],settings:[]};   /* Listen zur Anzeige */
const M={};KINDS.forEach(k=>M[k]=new Map());     /* Stand im Speicher: id -> Objekt */
let tab='learn',filter='all',tagFilter='',queue=[],cur=null,shown=false,step=1,editId=null,q='';
let undo=[],redo=new Set();
let ready=false,A,D,auth,db,user=null,fbErr='',syncMsg='',syncing=false,lastSrv={},kickT=null;

/* ---------- Lernalgorithmus FSRS-6 (Tagesversion). Formeln und Standardwerte wie in der Referenzbibliothek ts-fsrs ---------- */
const FW=[0.212,1.2931,2.3065,8.2956,6.4133,0.8334,3.0194,1e-3,1.8722,0.1666,0.796,1.4835,0.0614,0.2629,1.6483,0.6014,1.8729,0.5425,0.0912,0.0658,0.1542];
const r8=x=>Math.round(x*1e8)/1e8;
const cl=(x,a,b)=>Math.min(Math.max(x,a),b);
const DEC=-FW[20],FAC=r8(Math.exp(Math.log(0.9)/DEC)-1);
const retr=(t,s)=>r8(Math.pow(1+FAC*t/s,DEC));
const d0=g=>r8(FW[4]-Math.exp((g-1)*FW[5])+1);
function fsNext(m,t,g){
  if(!m)return{d:cl(d0(g),1,10),s:Math.max(FW[g-1],.1)};
  const s=m.s,d=m.d,r=retr(t,s);let ns;
  if(g===1){
    const sf=r8(cl(FW[11]*Math.pow(d,-FW[12])*(Math.pow(s+1,FW[13])-1)*Math.exp((1-r)*FW[14]),1e-3,36500));
    ns=cl(r8(s),1e-3,sf);
  }else{
    ns=r8(cl(s*(1+Math.exp(FW[8])*(11-d)*Math.pow(s,-FW[9])*(Math.exp((1-r)*FW[10])-1)*(g===2?FW[15]:1)*(g===4?FW[16]:1)),1e-3,36500));
  }
  const nd=cl(r8(FW[7]*d0(4)+(1-FW[7])*(d+r8(-FW[6]*(g-3)*(10-d)/9))),1,10);
  return{d:nd,s:ns};
}
function fsPlan(m,t,ret,maxI=36500){
  const mod=r8((Math.pow(ret,1/DEC)-1)/FAC);
  const out=[1,2,3,4].map(g=>{const n=fsNext(m,t,g);return{g,s:n.s,d:n.d,ivl:Math.min(Math.max(1,Math.round(n.s*mod)),maxI)}});
  let [a,h,g,e]=out.map(o=>o.ivl);
  a=Math.min(a,h);h=Math.max(h,a+1);g=Math.max(g,h+1);e=Math.max(e,g+1);
  [a,h,g,e].forEach((v,i)=>out[i].ivl=v);
  return out;
}
/* Gedächtniszustand einer Karte. Alte Karten aus der SM-2-Zeit werden dabei näherungsweise umgerechnet. */
function mem(c){
  if(!c.reps)return null;
  if(c.st>0)return{s:c.st,d:c.df,lr:c.lr};
  const iv=Math.max(1,c.interval||1);
  const ease=c.ease||2.5;
  return{s:iv,d:cl(10-(ease-1.3)*(9/1.9),1,10),lr:(c.due||today())-(c.interval||0)};
}
const settings=()=>M.settings.get('main')||{id:'main',newPerDay:20,retention:0.9};
function plan(c){const m=mem(c);return fsPlan(m,m?Math.max(0,today()-m.lr):0,settings().retention)}

/* ---------- Lokale Datenbank: jede Karte ist ein eigener Datensatz ---------- */
const dbp=new Promise((ok,no)=>{
  const r=indexedDB.open('karten2',2);
  r.onupgradeneeded=()=>{const d=r.result;[...KINDS].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta')};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);
});
const tx=async(st,mode,fn)=>{const d=await dbp;return new Promise((ok,no)=>{const t=d.transaction(st,mode);const out=fn(t);t.oncomplete=()=>ok(out&&out.result);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})};
const idbAll=st=>tx(st,'readonly',t=>t.objectStore(st).getAll());
const idbGet=(st,k)=>tx(st,'readonly',t=>t.objectStore(st).get(k));
const idbPut=(st,v,k)=>tx(st,'readwrite',t=>k===undefined?t.objectStore(st).put(v):t.objectStore(st).put(v,k));
const idbPutMany=(st,arr)=>tx(st,'readwrite',t=>{const o=t.objectStore(st);arr.forEach(v=>o.put(v))});

const pathCmp=(a,b)=>{const x=a.name.split('::'),y=b.name.split('::');for(let i=0;i<Math.min(x.length,y.length);i++){const c=x[i].localeCompare(y[i],'de');if(c)return c}return x.length-y.length};
function rebuild(){KINDS.forEach(k=>S[k]=[...M[k].values()]);S.decks.sort(pathCmp)}
function setLocal(kind,o){M[kind].set(o.id,o);rebuild()}
/* Jede lokale Änderung: Zeitstempel setzen, als „noch nicht hochgeladen“ markieren, speichern, Sync anstoßen */
function persist(kind,o){o.updatedAt=Date.now();o.dirty=1;idbPut(kind,o).catch(e=>alert('Lokales Speichern fehlgeschlagen: '+e));kick();ui()}
function persistMany(kind,arr){const t=Date.now();arr.forEach(o=>{o.updatedAt=t;o.dirty=1});idbPutMany(kind,arr).catch(e=>alert('Lokales Speichern fehlgeschlagen: '+e));kick();ui()}

/* Einmalig: Karten aus der allerersten, rein lokalen Version (Datenbank „karten“) übernehmen */
function readOld(){return new Promise(ok=>{
  const r=indexedDB.open('karten',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onerror=()=>ok(null);
  r.onsuccess=()=>{const d=r.result;try{const g=d.transaction('kv').objectStore('kv').get('state');g.onsuccess=()=>{d.close();ok(g.result)};g.onerror=()=>{d.close();ok(null)}}catch{d.close();ok(null)}};
})}
async function migrate(){
  const old=await readOld().catch(()=>null);
  if(old&&((old.cards||[]).length||(old.decks||[]).length)){
    const t=Date.now();
    (old.decks||[]).forEach(d=>M.decks.set(d.id,{...d,updatedAt:t,dirty:1}));
    (old.cards||[]).forEach(c=>M.cards.set(c.id,{...c,updatedAt:t,dirty:1}));
    await idbPutMany('decks',[...M.decks.values()]);await idbPutMany('cards',[...M.cards.values()]);
  }
  await idbPut('meta',1,'migrated');
}
async function boot(){
  try{
    const all=await Promise.all(KINDS.map(k=>idbAll(k)));
    KINDS.forEach((k,i)=>all[i].forEach(o=>M[k].set(o.id,o)));
    lastSrv=(await idbGet('meta','lastSrv'))||{};
    if(!(await idbGet('meta','migrated')))await migrate();
    rebuild();
  }catch(e){alert('Lokale Datenbank nicht verfügbar: '+e)}
  ready=true;render();fbInit();
}

/* ---------- Sync mit Firestore: es werden nur Änderungen übertragen ---------- */
const wt=(p,ms=25000)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('Zeitüberschreitung (offline?)')),ms))]);
const ref=(k,id)=>D.doc(db,'users',user.uid,k,id);
const dirtyCount=()=>KINDS.reduce((n,k)=>n+S[k].filter(x=>x.dirty).length,0);
const statusText=()=>!CFG.apiKey?'Nur lokal gespeichert (Cloud nicht eingerichtet).':fbErr?fbErr:!user?'Nicht angemeldet: nur lokal gespeichert.':(syncMsg||'Bereit.');
function ui(full){const ch=$('#chip');if(ch)ch.innerHTML=chipHTML();const s=$('#st');if(s)s.textContent=statusText();if(full&&tab==='data')render()}

async function fbInit(){
  if(!CFG.apiKey)return;
  try{
    const [app,au,fs]=await Promise.all([import(G+'firebase-app.js'),import(G+'firebase-auth.js'),import(G+'firebase-firestore.js')]);
    A=au;D=fs;
    const fa=app.initializeApp(CFG);
    auth=A.getAuth(fa);db=D.getFirestore(fa);
    A.onAuthStateChanged(auth,async u=>{
      user=u;syncMsg='';
      if(u){
        const su=await idbGet('meta','uid');
        if(su&&su!==u.uid){
          if(!confirm('Dieses Gerät enthält Karten eines anderen Kontos. In dieses Konto übernehmen?')){await A.signOut(auth);return}
          lastSrv={};await idbPut('meta',{},'lastSrv');
          KINDS.forEach(k=>S[k].forEach(x=>x.dirty=1));
          for(const k of KINDS)await idbPutMany(k,S[k]);
        }
        if(su!==u.uid)await idbPut('meta',u.uid,'uid');
        render();sync();
      }else render();
    });
  }catch(e){fbErr='Cloud-Skripte konnten nicht geladen werden (beim ersten Start ist Internet nötig). Lokal funktioniert alles.';render()}
}
async function login(create){
  const e=$('#em').value.trim(),p=$('#pw').value;
  if(!e||p.length<6)return alert('E-Mail und Passwort (mindestens 6 Zeichen) eingeben.');
  try{await(create?A.createUserWithEmailAndPassword(auth,e,p):A.signInWithEmailAndPassword(auth,e,p))}
  catch(x){alert('Anmeldung fehlgeschlagen ('+x.code+').')}
}
async function resetPw(){
  const e=$('#em').value.trim();if(!e)return alert('Bitte zuerst die E-Mail-Adresse eintragen.');
  try{await A.sendPasswordResetEmail(auth,e);alert('E-Mail zum Zurücksetzen wurde gesendet (auch im Spam-Ordner nachsehen).')}
  catch(x){alert('Fehlgeschlagen ('+x.code+').')}
}
const logout=()=>A.signOut(auth);

/* Datensatz aus der Cloud mit dem lokalen zusammenführen: der mit dem neueren Änderungszeitstempel gewinnt */
function mergeIn(kind,id,r){
  const l=M[kind].get(id);
  r={...r,id};delete r.srv;
  if(!l){M[kind].set(id,r);return r}
  if((l.updatedAt||0)>(r.updatedAt||0)){l.dirty=1;return null}
  Object.keys(l).forEach(k=>delete l[k]);Object.assign(l,r);
  return l;
}
async function pullKind(kind){
  const col=D.collection(db,'users',user.uid,kind);
  const prev=lastSrv[kind]||null;
  let max=prev,after=null,n=0,changed=false;
  for(;;){
    /* 2 Minuten Überlappung als Sicherheitspuffer; doppelt Gelesenes ist wegen des Zeitstempelvergleichs harmlos */
    const c=prev?[D.where('srv','>',new D.Timestamp(prev[0]-120,prev[1])),D.orderBy('srv')]:[D.orderBy(D.documentId())];
    if(after)c.push(D.startAfter(after));
    c.push(D.limit(500));
    const snap=await wt(D.getDocs(D.query(col,...c)));
    const touched=[];
    snap.docs.forEach(d=>{
      const x=d.data(),s=x.srv;
      if(s&&(!max||s.seconds>max[0]||(s.seconds===max[0]&&s.nanoseconds>max[1])))max=[s.seconds,s.nanoseconds];
      const o=mergeIn(kind,d.id,x);if(o){touched.push(o);changed=true}
    });
    if(touched.length)await idbPutMany(kind,touched);
    n+=snap.docs.length;
    if(n>500){syncMsg=`Lade ${kind} … ${n}`;ui()}
    if(snap.docs.length<500)break;
    after=snap.docs[snap.docs.length-1];
  }
  if(max&&(!prev||max[0]!==prev[0]||max[1]!==prev[1])){lastSrv[kind]=max;await idbPut('meta',lastSrv,'lastSrv')}
  return changed;
}
const wire=x=>{const o={...x};delete o.dirty;delete o.id;o.srv=D.serverTimestamp();return Object.fromEntries(Object.entries(o).filter(([,v])=>v!==undefined))};
async function push(kind){
  const dirty=S[kind].filter(x=>x.dirty);
  for(let i=0;i<dirty.length;i+=400){
    const chunk=dirty.slice(i,i+400),sent=chunk.map(x=>[x,x.updatedAt]);
    const b=D.writeBatch(db);chunk.forEach(x=>b.set(ref(kind,x.id),wire(x)));
    await wt(b.commit());
    const ok=[];sent.forEach(([x,u])=>{if(x.updatedAt===u){delete x.dirty;ok.push(x)}});
    await idbPutMany(kind,ok);
    syncMsg=`Lade hoch … ${Math.min(i+400,dirty.length)}/${dirty.length}`;ui();
  }
}
async function sync(){
  if(!user||!db||syncing)return;
  if(!navigator.onLine){syncMsg='Offline. Änderungen werden später hochgeladen.';ui();return}

    syncing=false;ui(true);

function renameDeck2(id,v){
  const d=M.decks.get(id);if(!d)return;
  const pp=d.name.split('::'),leaf=((pp.pop(),v)||'').replace(/::/g,' ').trim(),n=leaf?[...pp,leaf].join('::'):'';

    <input id=pw type=password autocomplete=current-password placeholder="Passwort (mind. 6 Zeichen)">
    <button class=b onclick=login(false)>Anmelden</button><button class="b g" onclick=login(true)>Konto erstellen</button>
    <button class="b g" onclick=resetPw()>Passwort vergessen</button>`;
  const n=dirtyCount();
  return `<p class=mute>Angemeldet als ${esc(user.email)}${n?` · ${n} Änderungen noch nicht hochgeladen`:' · alles hochgeladen'}</p>
    <button class=b onclick=sync()>Jetzt synchronisieren</button><button class="b g" onclick=logout()>Abmelden</button>
    <p class=mute>Beim Abmelden bleiben alle Karten auf diesem Gerät erhalten.</p>`;
}
function setSetting(k,v){let o=M.settings.get('main');if(!o){o={id:'main',newPerDay:20,retention:0.9};M.settings.set('main',o);rebuild()}o[k]=v;persist('settings',o)}

async function saveFile(name,text,type){
  const blob=new Blob([text],{type});
  try{
    const f=new File([blob],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return true}
    throw 0;
  }catch(e){
    if(e&&e.name==='AbortError')return false;
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();return true;
  }
}
const clean=x=>{const o={...x};delete o.dirty;return o};
const backupObj=()=>({version:4,exported:new Date().toISOString(),decks:liveDecks().map(clean),cards:liveCards().map(clean),logs:S.logs.map(clean),settings:S.settings.map(clean)});
async function exp(){
  if(await saveFile('karten-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(backupObj()),'application/json')){ls('lastBackup',new Date().toISOString());render()}
}
/* Prüft Datensätze, damit eine kaputte Datei nichts zerstört */
const okDeck=d=>d&&typeof d.id==='string'&&d.id&&typeof d.name==='string';
const okCard=c=>c&&typeof c.id==='string'&&c.id&&typeof c.front==='string'&&typeof c.back==='string'&&TYPES[c.type||'basic'];
const okLog=l=>l&&typeof l.id==='string'&&l.id&&Array.isArray(l.e)&&typeof l.day==='number';
async function imp(f){
  if(!f)return;
  let d;try{d=JSON.parse(await f.text())}catch{return alert('Ungültige Datei.')}
  if(!d||!Array.isArray(d.decks)||!Array.isArray(d.cards))return alert('Ungültige Datei.');
  const ds=d.decks.filter(okDeck),cs=d.cards.filter(okCard),ls_=(d.logs||[]).filter(okLog);
  const skipped=d.decks.length+d.cards.length+(d.logs||[]).length-ds.length-cs.length-ls_.length;
  if(!confirm(`${cs.length} Karten, ${ds.length} Stapel und ${ls_.length} Tage Lernverlauf wiederherstellen?${skipped?`\n${skipped} unbrauchbare Einträge werden übersprungen.`:''}`))return;
  const dl=[],cl_=[],ll=[];
  ds.forEach(x=>{const o={...x};delete o.deleted;M.decks.set(o.id,o);dl.push(o)});
  cs.forEach(x=>{const o={type:'basic',reps:0,due:today(),...x};delete o.deleted;M.cards.set(o.id,o);cl_.push(o)});
  /* Lernverlauf wird zusammengeführt statt überschrieben */
  ls_.forEach(x=>{
    const have=M.logs.get(x.id);
    if(have){const seen=new Set(have.e.map(y=>y[0]+'|'+y[1]));const add=x.e.filter(y=>!seen.has(y[0]+'|'+y[1]));if(add.length){have.e.push(...add);ll.push(have)}}
    else{const o={...x};M.logs.set(o.id,o);ll.push(o)}
  });
  if(d.settings&&d.settings[0]&&typeof d.settings[0].retention==='number'){const o={...d.settings[0],id:'main'};M.settings.set('main',o);persistMany('settings',[o])}
  rebuild();persistMany('decks',dl);persistMany('cards',cl_);persistMany('logs',ll);
  alert('Wiederherstellung abgeschlossen.');render();
}
/* Anki-Textimport: Tab-getrennt, HTML erlaubt. Lückentext-Syntax {{c1::…}} ist identisch zu Anki. */
const ah=s=>fmt(s).replace(/\t/g,' ').replace(/\r?\n/g,'<br>');
function ankiText(kind){
  const rows=liveCards().filter(c=>(kind==='cloze')===(c.type==='cloze'));
  const head=['#separator:tab','#html:true','#notetype:'+(kind==='cloze'?'Cloze':'Basic'),'#tags column:3','#deck column:4'];
  const out=rows.map(c=>{
    const d=M.decks.get(c.deck),dn=d&&!d.deleted?d.name:'Karten';
    const back=c.type==='steps'?'<ol>'+lines(c).map(x=>'<li>'+fmt(x.trim())+'</li>').join('')+'</ol>':ah(c.back);
    const tags=[dn.replace(/\s+/g,'_'),...(c.tags||[]).map(x=>x.replace(/\s+/g,'_'))].join(' ');
    return [ah(c.front),back,tags,dn.replace(/\t/g,' ')].join('\t');
  });
  return{text:[...head,...out].join('\n')+'\n',n:rows.length};
}
async function ankiOut(kind){
  const r=ankiText(kind);if(!r.n)return alert('Keine Karten dieser Art vorhanden.');
  await saveFile(kind==='cloze'?'anki-luecken.txt':'anki-karten.txt',r.text,'text/plain');
}

  $('#app').innerHTML=(focus?'':`<div class=chiprow><span id=chip class=chip>${chipHTML()}</span></div>`)+{learn:learnView,cards:cardsView,stats:statsView,data:dataView}[tab]()+(focus?'':`<p class=mute id=st>${esc(statusText())}</p>`);
  if(tab==='cards'&&$('#ct'))hint();
}

}
